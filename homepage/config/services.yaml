- Media:
    - Jellyfin:
        icon: jellyfin.png
        server: socketproxy
        container: jellyfin
        href: "http://192.168.4.80:8096"
        description: Media server
        siteMonitor: "http://192.168.4.80:8096"
        widget:
          type: jellyfin
          version: 2
          url: "http://192.168.4.80:8096"
          key: "<api key, not committed>"
          enableBlocks: true
          enableNowPlaying: true
    - slskd:
        icon: mdi-music
        server: socketproxy
        container: slskd
        href: "http://192.168.4.80:5030"
        description: Soulseek via ProtonVPN
        siteMonitor: "http://192.168.4.80:5030"
        widget:
          type: slskd
          url: "http://192.168.4.80:5030"
          key: "<api key, not committed>"
          fields: ["slskStatus", "downloads", "uploads", "sharedFiles"]

