- Host and VMs:
    - thomashomeserv:
        icon: mdi-server
        href: "http://192.168.4.80:3000"
        description: Host system
        widget:
          type: customapi
          url: "http://192.168.4.80:8099/vms.json"
          refreshInterval: 30000
          mappings:
            - field: host.down
              label: Down
            - field: host.up
              label: Up
            - field: host.load
              label: Load
            - field: host.wifi
              label: Wi-Fi
    - game-servers VM:
        icon: mdi-gamepad-variant
        description: Project Zomboid + Minecraft
        widget:
          type: customapi
          url: "http://192.168.4.80:8099/vms.json"
          refreshInterval: 30000
          mappings:
            - field: game_servers.state
              label: State
            - field: game_servers.cpu
              label: CPU
            - field: game_servers.mem
              label: RAM
    - OPNsense VM:
        icon: opnsense.png
        href: "https://opnsense.100.64.113.70.nip.io"
        description: Firewall
        widget:
          type: customapi
          url: "http://192.168.4.80:8099/vms.json"
          refreshInterval: 30000
          mappings:
            - field: opnsense.state
              label: State
            - field: opnsense.cpu
              label: CPU
            - field: opnsense.mem
              label: RAM

