services:
  minecraft-server:
    image: itzg/minecraft-server
    container_name: minecraft-server
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      VERSION: LATEST
      MEMORY: 3G
    volumes:
      - .:/data
    restart: unless-stopped
    stdin_open: true
    tty: true
