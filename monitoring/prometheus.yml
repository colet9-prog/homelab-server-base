global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['192.168.4.80:9100']

  - job_name: 'libvirt-exporter'
    static_configs:
      - targets: ['libvirt-exporter:9177']
